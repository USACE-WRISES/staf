[project]
name = "easi"
version = "1.0.0"
description = "Automated Ecosystem Assessment Screening Index (EASI) web app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["excel: recalculates the Excel calculator in the installed Excel (opt in with EASI_EXCEL_PARITY=1)"]
