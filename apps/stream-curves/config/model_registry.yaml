# model_registry.yaml: the modeled-reference specifications a build may run
# (REF-13, methodology 0.14).
#
# A build runs an entry only when its status is `approved` and the target sits
# inside the entry's validated application limits. Both are read from here and
# the limits are computed for each target from its own data, so applicability is
# never a hand-kept list of ecoregions.
#
# Approval is the owner's, recorded with the evidence it rests on. `candidate`
# entries come from a pre-registered recovery test (scripts/build_model_registry.py)
# and are never run until the owner approves them: developing and approving a
# model is separate from creating an assessment.
#
# The limits of an entry are those of the evidence that approved it:
#   min_coverage_share    the smallest share of a tested region's streams whose
#                         natural setting the low-disturbance training stations
#                         covered, among the cells where the model passed
#   max_disturbance_gap   per pressure, the largest distance between a tested
#                         region's least-disturbed training station and the
#                         national reference point, among those cells
# A target further from the reference point on any pressure, or less covered,
# was never tested in conditions like its own, and the entry refuses it.

version: 1

procedures:
  mixed_local:
    description: >-
      The metric regressed on five natural covariates and seven landscape
      pressures with a random intercept for each Level III ecoregion. It is
      fitted on every other ecoregion's stations plus the target's own
      non-reference stations, predicted at the median pressure of the national
      least-disturbed stations with the target's own intercept added, and 200
      residual draws per target station form the reference population. The
      ordinary curve engine builds the curve, and 20 refits on HUC12 cluster
      resamples state its anchor interval.
    natural_covariates: [drainage_area_sqkm, nhd_slope, tmean8110ws, precip8110ws, bfiws]
    pressures: [pctimp2019ws, agriculture_ws, rddensws, dor, nabd_densws, npdesdensws, mines_ws]
    reference_condition: median pressure of the national strict-screen least-disturbed stations
    training: every other Level III ecoregion, plus the target's own non-reference stations
    residual_draws: 200
    bootstrap_refits: 20
    seed: 11

requirements:
  # the target's own non-reference stations with a value, which estimate its
  # level: the DATA-05 exploratory floor
  min_target_stations: 10

entries:
  - metric: bent_HPRIME
    procedure: mixed_local
    status: approved
    approval:
      by: gtmenichino
      on: "2026-09-21"
      record: >-
        Used by the Eastern Corn Belt Plains v7 assessment, published under
        methodology 0.13 on the owner's authorization.
    evidence:
      preregistration: PREREGISTRATION_III.md
      preregistration_sha256: cfb2a60267048fe36b0deaa3a2e80a945d1d59d1f4b16d6c34c0f3716211d4c2
      run: basis_validation/2026-09-21/round_three
      regime: E
      verdict: validated
      n_cells: 4
      passing_cells: ["35", "43", "65", "67"]
    limits:
      min_coverage_share: 0.0723
      max_disturbance_gap:
        pctimp2019ws: 0.34
        agriculture_ws: 31.42
        rddensws: 0.3107
        dor: 0.0
        nabd_densws: 0.0
        npdesdensws: 0.0
        mines_ws: 0.0

