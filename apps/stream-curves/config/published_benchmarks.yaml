# Criteria checked and found unsuitable. Each `why` is read on a DEEP card, so it
# names no code, file or constant. `applies_where` limits a sentence to the
# targets it is true for.
refusals:
  - id: dissolved-nitrogen-fraction
    metrics: [chem_NTL_DISS]
    why: >-
      NRSA Table 7-1 is written for total nitrogen. Dissolved nitrogen is a
      different fraction, so the criterion does not measure it and no conversion
      would be defensible.
  - id: no-ph-criterion
    metrics: [chem_PH]
    why: >-
      The published criteria STAF draws on include no regional criterion for pH.
      NRSA rates acidity on acid neutralizing capacity together with dissolved
      organic carbon and sulfate, a different measurement from pH.
  - id: no-turbidity-criterion
    metrics: [chem_TURB]
    why: The published criteria STAF draws on include no regional criterion for turbidity.
  - id: state-biological-indices
    metrics: [fish_NAT_TOTLNTAX, fish_NAT_NTOLNTAX, fish_NAT_NTOLPTAX, fish_NAT_TOLRPIND,
              fish_NAT_LITHPIND, bent_TOTLNTAX]
    why: >-
      Every published biological criterion in the STAF assessment library is
      scored on a state-specific field index (Michigan Procedure 51, the Carolina
      IBI scores, the Wisconsin and Minnesota IBIs), none of which can be computed
      from NRSA data, so none measures the same quantity as this metric. EPA's own
      NRSA benchmarks are set on its multimetric indices, which this assessment
      carries as metrics of their own; an index benchmark is never applied to one
      of the metrics the index is built from.
  - id: benthic-oe-taxa-loss-categories
    metrics: [bent_OE_SCORE]
    checked_on: "2026-09-28"
    why: >-
      EPA publishes the benthic observed-to-expected taxa ratio in four taxa-loss
      categories (less than 10, 10 to 20, 20 to 50 and more than 50 percent of the
      expected taxa missing) and never as good, fair or poor condition, and it
      states that a ratio is read against the spread of ratios among reference
      sites rather than as a loss on its own; a quarter of EPA's own reference
      sites fall below 0.8. Choosing two of the four boundaries as condition
      classes would be this assessment's construction, not EPA's, so no benchmark
      is adopted for the ratio.
  - id: nrsa-habitat-modeled-expectations
    metrics: [phab_XCMGW, phab_XFC_NAT, phab_LRBS_use]
    checked_on: "2026-09-28"
    why: >-
      NRSA rates riparian vegetation cover, instream fish cover and bed stability
      against an expected value modeled for each site from its natural setting,
      and publishes the resulting class but not the expected values or a
      threshold on the measured metric. The same measured value is Good at one
      site and Poor at another, so there is no published threshold on this metric
      to adopt.
  - id: channel-form-no-published-benchmark
    metrics: [phab_XBKA, phab_SINU, phab_XBKF_H, phab_BFWD_RAT]
    checked_on: "2026-09-28"
    why: >-
      No national or regional assessment publishes a condition benchmark for bank
      angle, sinuosity, bankfull height or the bankfull width to depth ratio as
      NRSA measures them. The state stream quantification tools rate channel and
      floodplain dynamics on the bank height ratio and on the share of eroding or
      armored bank, field measurements this archive does not carry. Where no
      station pool supports this metric the function is completed by measuring
      the bank height ratio at the assessment reach and scoring it on the
      published curve for the state (the Minnesota and Wisconsin tools, verified
      against their originals) or on the national Stream Functions Pyramid
      standard (1.0 to 1.2 functioning, above 1.5 not functioning), entered as a
      provisional source with its citation.
  - id: ohio-epa-biocriteria
    metrics: [fish_NAT_TOTLNTAX, fish_NAT_NTOLNTAX, fish_NAT_NTOLPTAX, fish_NAT_TOLRPIND,
              fish_NAT_LITHPIND, bent_TOTLNTAX]
    checked_on: "2026-09-21"
    applies_where: {l3: ["55"]}
    why: >-
      Ohio EPA's ecoregional biocriteria, the nearest published criterion for this
      ecoregion, were checked on 2026-09-21 and are not usable either. They set
      thresholds on composite indices rather than on a single community metric
      such as this one, those indices are computed under Ohio's own field
      protocol and are not carried by the NRSA archive, and they are Ohio water
      quality standards while half this ecoregion's stations lie in Indiana.

# Methodology 0.16, owner decisions D18 and D19 (2026-09-28): a documented gap does
# not complete a function. Where no station pool, national donor, approved model,
# published benchmark or flagged transfer serves a function, the last-resort rung
# (REF-17) scores it on EASI's national screening method for the same quantity, the
# curves generated from the vendored EASI catalog into config/fixed_criteria.yaml
# (block last_resort) by scripts/build_fixed_criteria.py. The entries below state the
# measurement and its protocol, how the value enters DEEP, the scoring source and the
# disclosure, for a reader and for a DEEP card (published_benchmark.pathway_for and
# pathway_sentence). Nothing here is fetched or fitted at build time.
input_pathways:
  - id: channel-floodplain-dynamics-bank-height-ratio
    function: channel-floodplain-dynamics
    implemented_by: config/fixed_criteria.yaml last_resort bank_height_ratio (REF-17)
    applies_when: >-
      No pool of ten comparable least-disturbed stations at any level carries bank
      angle or sinuosity, the national donors fail the comparability or stability
      checks, no published benchmark exists for the NRSA channel-form metrics and no
      flagged transfer passes (the Nebraska Sand Hills, 44, in the 0.15 pass and the
      census; the Northern Minnesota Wetlands, 49, where the missingness rule withheld
      the Level II pools).
    measurements:
      - key: bank_height_ratio
        name: Bank height ratio
        units: ratio
        direction: lower_is_better
        domain: [1.0, null]
        protocol: >-
          The height of the lower top of bank above the thalweg divided by the maximum
          bankfull depth, both at a representative riffle cross section of the assessment
          reach, the field procedure of the stream quantification tools and of Rosgen
          (2006); a ratio of 1.0 means flows above bankfull spread onto the floodplain.
    scoring:
      - states: any
        measurement: bank_height_ratio
        source: >-
          EASI's bank-instability screening method, Good at or below 1.3, Fair above 1.3
          to 1.5, Poor above 1.5, the bands EASI takes from the Minnesota Stream
          Quantification Tool and the function-based framework of Harman and others
          (2012), adopted as the last resort for this function.
        classes: "Good at or below 1.3, Fair above 1.3 to 1.5, Poor above 1.5"
    follow_up: >-
      The state tools' own curves (Minnesota SQT v2.0 and Wisconsin SQT 2022 for the
      bank height ratio, percent streambank erosion and percent armoring; registry keys
      sqt:mn:bank-height-ratio-bhr:default, sqt:mn:percent-streambank-erosion:default,
      sqt:mn:percent-armoring:default, sqt:wi:bank-height-ratio-bhr:default,
      sqt:wi:percent-streambank-erosion:default, sqt:wi:percent-streambank-armoring:default)
      can replace the national bands where the target lies in that state, once D4a's
      verification and adoption conditions are met.
    deep_entry: >-
      The measurement is the function's input in DEEP: the value measured at the reach is
      scored on the curve like any other metric, DEEP offers a DEM-derived value only
      where the cross sections pass the quality checks and otherwise leaves the function
      unassessed until a value is entered, the calculator computes the index from the same
      value, and the report and the metric row carry the label, the citation and the
      provisional flag.
    disclosure: >-
      Provisional. Adopted from EASI's national screening method, a published directional
      relationship EASI applies in every region; it is not an estimate of this ecoregion's
      reference condition, and the bank height ratio does not measure erosion rate or
      armoring directly.
  - id: surface-water-storage-easi-wetland-extent
    function: surface-water-storage
    implemented_by: config/fixed_criteria.yaml last_resort pctwet2019ws (REF-17)
    applies_when: >-
      Least-disturbed watersheds of the ecoregion carry little or no wetland, so every
      reference pool's curve is a fallback or reads as inverted and no other source
      serves the function (the Northern Rockies, 15: 31 percent of the region's in-frame
      watersheds hold no wetland; the Interior Plateau, 71).
    measurements:
      - key: pctwet2019ws
        name: Wetland cover of the watershed
        units: "%"
        direction: higher_is_better
        domain: [0, 100]
        protocol: >-
          The same desktop input, NLCD 2019 woody plus herbaceous wetland over the
          watershed, from the StreamCat lookup engine or the STAF site engine.
    scoring:
      - states: any
        measurement: pctwet2019ws
        source: >-
          EASI's wetland-extent screening method, national transitions at 1 and 5 percent
          taken from the reviewed wetland-benefit range (Mitsch and Gosselink, as reviewed
          by the Chesapeake Bay Program 2016), adopted as the last resort for this function.
        classes: "Poor below 1 percent, Fair 1 to 5 percent, Good above 5 percent"
    follow_up: >-
      A regional storage indicator for wetland-poor ecoregions. The two-part
      zero-inflated seed (Round 2 candidate C3a) was examined and not adopted: it also
      scores zero wetland as 0, and its study found no accuracy gain.
    deep_entry: >-
      No new input: DEEP reads the watershed wetland share it already computes, and the
      curve's label says which method scores it.
    disclosure: >-
      Provisional. Adopted from EASI's national screening method, a provisional screening
      judgment that rates the quantity the same way in every region: a watershed with no
      mapped wetland rates Poor, so where least-disturbed watersheds carry none the rating
      cannot tell natural absence from loss.

# What a refusal says for a metric the catalog holds nothing on at all.
no_entry: The published criteria STAF draws on include none for this metric.
