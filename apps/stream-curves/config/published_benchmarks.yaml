    source_tier: epa-national-survey-benchmark
    confidence: M
    provisional: false
    limitations:
      - >-
        The benchmarks rest on EPA's least-disturbed reference sites and their
        disturbance-adjusted 5th and 25th percentiles, a definition of reference
        that need not match this assessment's landscape-pressure screen.
      - >-
        The index is defined by the NRSA benthic protocol and EPA's regional metric
        scoring; a value from another sampling method, count size, taxonomic
        resolution or scoring is not comparable with these benchmarks.
      - >-
        One set of benchmarks serves each NARS-9 region, wadeable and boatable
        sites alike; the benchmarks were set in 2008-09 and have not been revised.
    scoring: >-
      The two breakpoints become the Fair to Poor and Good to Fair boundaries of a
      STAF curve through the same construction as the fixed criteria (CURVE-11):
      Good scores above 0.69, Fair between 0.39 and 0.69, Poor below 0.39, and a
      higher index scores higher.

  - id: nrsa-2018-19-fish-mmi
    metric: fish_MMI_FISH
    title: NRSA fish MMI condition benchmarks
    analyte: fish assemblage multimetric index
    fraction: index
    definition: >-
      the NRSA fish multimetric index (MMI_FISH), EPA's index of eight metrics per
      NARS-9 region, several adjusted for watershed area, scored and rescaled to 0
      to 100, the index and benchmarks of the 2013-14 survey applied unchanged in
      2018-19 and 2023-24
    purpose: condition-assessment
    direction: higher_is_better
    units: {benchmark: MMI points, metric: MMI points, factor: 1.0}
    resolution: 0.01
    domain: [0, 100]
    sampling: >-
      A single-pass electrofishing sample of the NRSA reach under the NRSA fish
      protocol (reach length and effort by stream size), all fish identified to
      species, and EPA's eight regional metrics scored, several after adjustment for
      watershed area; sites sampled by seining carry no index, and a site under two
      square kilometres where no fish were caught is not scored.
    stream_types: >-
      Perennial streams and rivers in the NRSA sample frame, wadeable and boatable,
      one set of benchmarks per NARS-9 region.
    geography: {kind: nars9}
    edition: "2018-19"
    thresholds:       # [Poor below, Good at or above] in MMI points, per NARS-9 region
      CPL: [46.8, 57.3]
      NAP: [47.1, 57.6]
      NPL: [35.8, 46.3]
      SAP: [49.8, 60.3]
      SPL: [39.7, 50.2]
      TPL: [47.5, 58.0]
      UMW: [29.3, 39.8]
      WMT: [65.4, 75.9]
      XER: [66.3, 76.8]
    class_rule: {good: at_or_above, poor: below}
    thresholds_source:
      catalog: nrsa-tsd-2018-19
      document: "National Rivers and Streams Assessment 2018-2019 Technical Support Document, Version 1.1, EPA 841-R-22-005 (November 2023, updated September 2024)"
      table: "Table 6-15. Benchmarks for assigning ecological condition based on the distribution of regional fish MMI scores in least-disturbed sites sampled in NRSA 2008-09 or NRSA 2013-14, adjusted using the hindcasting approach of Herlihy et al. (2008)"
      page: 73
      url: "https://www.epa.gov/system/files/documents/2024-12/nrsa-2018-19-tsd-final-11252024.pdf"
      derivation: >-
        Section 6.6 (pages 71 to 73): the same hindcast 25th and 5th percentile
        process as the benthic MMI, on the least-disturbed sites of 2008-09 and
        2013-14 combined; the benchmarks of every region differ by 10.5 points
        (page 73) and were not updated for 2018-19 (page 28).
      note: >-
        The Xeric West fair-to-poor bound is entered as 66.3, not the 63.7 the
        printed tables show (Table 6-15, page 74, and the 2013-14 Appendix B). The
        printed value does not reproduce EPA's own classes: in every cycle EPA
        classed Xeric West sites with scores up to 66.09 as Poor and from 66.31 as
        Fair, and the document states that the two benchmarks of every region
        differ by 10.5 points (76.8 - 10.5 = 66.3). The value EPA applied is
        adopted; the printed figure is treated as a typographical error.
      corroboration:
        - "NRSA 2013-14 Technical Support Document, Appendix B, Ecoregion-Specific Benchmarks Used in NRSA 2013-14 (page 1): the same values, Xeric West poor bound printed 63.7; https://www.epa.gov/system/files/documents/2021-10/nrsa_2013-14_appendix_b_c_accessible_ci.pdf"
    verification:
