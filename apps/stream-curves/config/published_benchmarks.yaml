          NPL: {n: 439, agree: 439}
          SAP: {n: 866, agree: 866}
          SPL: {n: 472, agree: 472}
          TPL: {n: 742, agree: 742}
          UMW: {n: 584, agree: 584}
          WMT: {n: 810, agree: 810}
          XER: {n: 583, agree: 583}
    citation:
      key: nrsa-2018-19
      title: "National Rivers and Streams Assessment 2018-19 Technical Support Document"
      edition: "Version 1.1, EPA 841-R-22-005, November 2023, updated September 2024"
      url: "https://www.epa.gov/system/files/documents/2024-12/nrsa-2018-19-tsd-final-11252024.pdf"
    region_citation:
      key: nars-regions
