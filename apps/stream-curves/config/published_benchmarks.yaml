  # ------------------------------------------------------------------------- #
  # Methodology 0.16 (owner decision D12, 2026-09-28): EPA NRSA condition
  # benchmarks for the two NRSA biological indices and for salinity, adopted
  # after the published-benchmark review and verified against EPA's own class
  # calls (review record: notes/2026-09-25_National_Campaign/reports/
  # R6_benchmark_review.md; handoff report agent_reports/WP-R6b.md).
  # ------------------------------------------------------------------------- #
  - id: nrsa-2018-19-benthic-mmi
    metric: bent_MMI_BENT
    title: NRSA benthic macroinvertebrate MMI condition benchmarks
    analyte: benthic macroinvertebrate multimetric index
    fraction: index
    definition: >-
      the NRSA benthic macroinvertebrate multimetric index (MMI_BENT), EPA's
      Wadeable Streams Assessment MMI of six metrics scored per NARS-9 region and
      rescaled to 0 to 100 (Stoddard et al. 2008), the same index and scoring in
      the 2008-09, 2013-14, 2018-19 and 2023-24 surveys
    purpose: condition-assessment
    direction: higher_is_better
    units: {benchmark: MMI points, metric: MMI points, factor: 1.0}
    resolution: 0.01
    domain: [0, 100]
    sampling: >-
      A reachwide composite of eleven transect kick samples taken with a D-frame net
      of 500 micrometre mesh, a fixed count of 500 organisms identified to EPA's
      standard taxonomic level, and the six regional metrics scored against EPA's
      published floor and ceiling values, the NRSA benthic protocol the index is
      defined by.
    stream_types: >-
      Perennial streams and rivers in the NRSA sample frame, wadeable and boatable,
      one set of benchmarks per NARS-9 region.
    geography: {kind: nars9}
    edition: "2018-19"
    thresholds:       # [Poor below, Good at or above] in MMI points, per NARS-9 region
      CPL: [40.7, 54.9]
      NAP: [40.9, 55.0]
      NPL: [42.6, 56.8]
      SAP: [30.8, 45.0]
      SPL: [21.3, 35.5]
      TPL: [26.2, 40.3]
      UMW: [22.7, 36.9]
      WMT: [35.9, 50.1]
      XER: [42.8, 57.0]
    class_rule: {good: at_or_above, poor: below}
    thresholds_source:
      catalog: nrsa-tsd-2018-19
      document: "National Rivers and Streams Assessment 2018-2019 Technical Support Document, Version 1.1, EPA 841-R-22-005 (November 2023, updated September 2024)"
      table: "Table 5-3. Benchmark Values for the Nine Regional Benthic MMIs"
      page: 41
      url: "https://www.epa.gov/system/files/documents/2024-12/nrsa-2018-19-tsd-final-11252024.pdf"
      derivation: >-
        Section 5.3.2 (page 40): the 25th and 5th percentiles of the least-disturbed
        reference distribution per NARS-9 region, hindcast to the 25th percentile of
        the reference sites' disturbance score (Herlihy et al. 2008), Good-Fair =
        MMIpred - 0.675 RMSE, Fair-Poor = MMIpred - 1.650 RMSE; the same benchmarks
        in NRSA 2008-09, 2013-14 and 2018-19 (page 36).
      corroboration:
        - "NRSA 2008-2009 Technical Report, EPA/841/R-16/008, Table 9.3 (page 52): identical values"
        - "NRSA 2013-14 Technical Support Document, Appendix B, Ecoregion-Specific Benchmarks Used in NRSA 2013-14 (page 1): identical values; https://www.epa.gov/system/files/documents/2021-10/nrsa_2013-14_appendix_b_c_accessible_ci.pdf"
    verification:
      epa_class_column: BENT_MMI_COND
      checked_on: "2026-09-28"
      script: scripts/nrsa/verify_benchmark_classes.py
      sources:
        - {cycle: "1314", file: nrsa1314_allcond_05312019_0.csv, value_column: MMI_BENT, class_column: BENT_MMI_COND}
        - {cycle: "1819", file: nrsa-1819-benthic-macroinvertebrate-mmi-data.csv, value_column: MMI_BENT, class_column: BENT_MMI_COND}
        - {cycle: "2324", file: nrsa2324_benthicmmi.csv, value_column: MMI_BENT, class_column: BENT_MMI_COND, region_from: nrsa2324_siteinfo.csv}
      result:
        n: 6083
        agree: 6083
        share: 1.0
        per_cycle: {"1314": {n: 1848, agree: 1848}, "1819": {n: 2106, agree: 2106}, "2324": {n: 2129, agree: 2129}}
        per_region:
          CPL: {n: 791, agree: 791}
