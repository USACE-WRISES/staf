# ─────────────────────────────────────────────────────────────────────────────
# metric_names.yaml — curated display names, highest precedence
# ─────────────────────────────────────────────────────────────────────────────
# scripts/nrsa/build_metric_dictionary.py folds four label sources plus EPA's
# own field metadata into data/nrsa/metric_dictionary.csv. This file wins over
# all of them, and is where a metric goes when the automatic name is wrong,
# reads as a paragraph, or does not exist.
#
# Most metrics need no entry: metric_map.yaml already carries good labels for
# the metrics the function crosswalk uses, and EPA's metadata covers the rest.
# Add an entry only when you have looked at the generated name and it is bad.
#
# Each entry:
#   display_name  the readable name (the build derives short_name from it)
#   units         optional, overrides whatever the build inferred
#   description   optional, overrides EPA's definition in tooltips
#
# After editing, rerun:
#   py -3.12 scripts/nrsa/build_metric_dictionary.py
# ─────────────────────────────────────────────────────────────────────────────

metrics:

  # ── Physical habitat ────────────────────────────────────────────────────────
  # EPA's definition is "Human Disturbance Index(distance-wtd tally of types and
  # presence used in NRSA)", which does not fit a tile header.
  phab_W1_HALL:
    display_name: "Human disturbance index"
    description: >-
      Riparian human disturbance index: a distance-weighted tally of the human
      influence types observed in the riparian plots, so higher means more
      disturbance.

  # "Mean Slope of water surface-used used in assessment" is EPA's text for the
  # coalesced field/map slope column.
  phab_XSLOPE_use:
    display_name: "Channel slope"
    units: "%"
    description: >-
      Reach mean channel slope, taken from the field measurement where one
      exists and from the map-based calculation otherwise.

  # EPA spells the formula out: "Riparian Quality Index (Scaled 0 to
  # 1):QR1=(QRVEG1*QRVEG2*QRDIST1)**(1/3)"
  phab_QR1:
    display_name: "Riparian quality index"
    description: >-
      Riparian quality index, the geometric mean of the two scaled riparian
      vegetation indices and the scaled lack-of-disturbance index, on 0 to 1.

  # ── Water chemistry ─────────────────────────────────────────────────────────
  # The wide chemistry files document these as "Analyte value: <name>", which
  # leaves the analyte buried behind a template prefix.
  chem_ANC:
    display_name: "Acid neutralizing capacity"
    units: "uEQ/L"

  # EPA's metadata name is the bare analyte, which reads inconsistently beside
  # "Total phosphorus". The unit is already the nitrogen-as-N basis the
  # published NRSA criteria are written against.
  chem_NTL:
    display_name: "Total nitrogen"
    units: "mg N/L"
    description: >-
      Total nitrogen, the whole fraction rather than the dissolved part.
      Reported in every NRSA cycle, unlike dissolved nitrogen, which is
      reported in one of the three.

  # ── Fish ────────────────────────────────────────────────────────────────────
  # EPA's metadata name is "No. native non-tolerant taxa based on
  # TOLERANCE_NRSA", which buries the metric behind a column reference.
  fish_NAT_NTOLPTAX:
    display_name: "Native non-tolerant fish taxa (%)"
    units: "%"
    description: >-
      The share of native fish taxa that are not classed tolerant in NRSA's
      tolerance assignment, as a percent of all native taxa in the sample.
  fish_NAT_TOLRPIND:
    display_name: "Tolerant native fish individuals (%)"
    units: "%"
    description: >-
      The share of native fish individuals that belong to taxa NRSA classes as
      tolerant, as a percent of all native individuals in the sample.
  fish_NAT_LITHPIND:
    display_name: "Simple lithophil fish individuals (%)"
    units: "%"
    description: >-
      The share of native fish individuals that spawn on clean gravel and cobble
      without building a nest (simple lithophils), as a percent of all native
      individuals in the sample.
  fish_NAT_NTOLNTAX:
    display_name: "Native non-tolerant fish taxa richness"
    description: >-
      The number of distinct native fish taxa that are not classed tolerant in
      NRSA's tolerance assignment. Total richness can hold steady under
      disturbance because tolerant species replace intolerant ones, so this
      counts only the taxa that do not tolerate it.

  # ── EPA's NRSA indices (methodology 0.16, owner decision D12, 2026-09-28) ──
  # EPA's metadata names them by their database mnemonics. Each index is a metric
  # of its own, scored against EPA's own condition benchmarks where no station
  # pool supports it.
  bent_MMI_BENT:
    display_name: "Benthic macroinvertebrate MMI"
    units: "MMI points"
    description: >-
      EPA's NRSA benthic macroinvertebrate multimetric index, six metrics of
      composition, diversity, feeding, habit, richness and tolerance scored per
      NARS-9 region and rescaled to 0 to 100; higher is better.
  fish_MMI_FISH:
    display_name: "Fish MMI"
    units: "MMI points"
    description: >-
      EPA's NRSA fish multimetric index, eight metrics per NARS-9 region, several
      adjusted for watershed area, scored from an electrofishing sample and
      rescaled to 0 to 100; higher is better.
  bent_OE_SCORE:
    display_name: "Benthic O/E taxa loss ratio"
    units: "ratio"
    description: >-
      EPA's NRSA observed-to-expected ratio for benthic macroinvertebrates: the
      taxa observed at a site as a share of those a predictive model expects
      under least-disturbed conditions. A ratio of 1.0 is the expectation;
      published for the 2013-14 survey only.
