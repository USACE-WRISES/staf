<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>STAF Desktop</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <header class="shell-header">
    <div>
      <h1>STAF <span class="muted">— Stream Tiered Assessment Framework</span></h1>
      <p class="tagline">Launch the assessment apps on this computer. Data services (USGS/EPA) still require an internet connection.</p>
    </div>
    <button id="open-website" class="btn btn-secondary" type="button" title="Open the STAF website in your browser">STAF website ↗</button>
  </header>

  <main>
    <!-- First-run payload setup (driven by the shell's payload manager) -->
    <section id="setup-view" class="setup-view" hidden>
      <h2>Setting up STAF Desktop</h2>
      <p id="setup-message">Preparing…</p>
      <div class="progress" id="setup-progress"><div id="setup-bar" class="progress-bar" style="width: 0%"></div></div>
      <p id="setup-detail" class="muted"></p>
      <div id="setup-actions" class="setup-actions" hidden>
        <button id="setup-retry" class="btn btn-primary" type="button">Try again</button>
        <button id="setup-from-file" class="btn btn-secondary" type="button" title="Install from an offline bundle folder">Install from file…</button>
      </div>
    </section>

    <section id="apps-view">
      <div id="apps-grid" class="apps-hub-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="shell-footer">
    <span id="footer-mode" class="muted"></span>
    <span class="footer-actions">
      <span id="update-chip" class="update-chip" hidden>
        <span id="update-text"></span>
        <button id="update-install" class="btn btn-primary btn-small" type="button">Install</button>
      </span>
      <span id="ts-menu" class="ts-menu" hidden>
        <button id="ts-clear" class="btn btn-quiet" type="button" title="Delete cached USGS/EPA downloads (safe — they re-download as needed)">Clear app caches</button>
        <button id="ts-revert" class="btn btn-quiet" type="button" title="Switch back to the previous runtime/app version">Revert last update</button>
        <button id="ts-file" class="btn btn-quiet" type="button" title="Install a payload from an offline bundle folder">Install from file…</button>
      </span>
      <a href="#" id="ts-toggle">Troubleshooting</a>
      <a href="#" id="open-logs">Open logs folder</a>
    </span>
  </footer>

  <script src="launcher.js"></script>
</body>
</html>
