<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>StreamCurves Desktop</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main>
    <!-- The tile, not a white glyph: this page's ground is #f6f8fb. Local file only;
         the CSP is default-src 'none' with img-src 'self', so nothing external loads. -->
    <div class="brand">
      <img class="brand-mark" src="streamcurves-icon-64.png" alt="" width="64" height="64">
      <h1>StreamCurves</h1>
      <p class="tagline">Reference &amp; Regional Curve Development</p>
    </div>

    <!-- App is being launched (the normal path: this page shows only briefly) -->
    <section id="starting-view" class="panel">
      <div class="spinner" aria-hidden="true"></div>
      <p id="starting-message">Preparing…</p>
      <p id="starting-detail" class="muted"></p>
    </section>

    <!-- First-run payload setup / update install (driven by the shell's payload manager) -->
    <section id="setup-view" class="panel" hidden>
      <h2>Setting up StreamCurves Desktop</h2>
      <p id="setup-message">Preparing…</p>
      <div class="progress" id="setup-progress"><div id="setup-bar" class="progress-bar" style="width: 0%"></div></div>
      <p id="setup-detail" class="muted"></p>
      <div id="setup-actions" class="setup-actions" hidden>
        <button id="setup-retry" class="btn btn-primary" type="button">Try again</button>
        <button id="setup-from-file" class="btn btn-secondary" type="button" title="Install from an offline bundle folder">Install from file…</button>
      </div>
    </section>
  </main>

  <footer class="shell-footer">
    <span id="footer-mode" class="muted"></span>
    <a href="#" id="open-logs">Logs</a>
  </footer>

  <script src="launcher.js"></script>
</body>
</html>
