# The STAF assessment tools as the site offers them: the Apply STAF page, the home page, the tier
# pages and the /easi/, /sfari/ and /deep/ redirects. This is the single source of truth for the site.
# - url: the web application. EASI, SFARI and DEEP open inside the STAF app on Posit Connect Cloud
#   (?tool=); their standalone apps were retired on 2026-10-08. Each app keeps its own copy of these
#   URLs in its STAF_LINKS (there is no shared build step between this site and the apps), so a URL
#   change must be mirrored there; each tool's tests/test_site_links.py (DEEP: test_site_calculators.py)
#   checks it.
# - calculator, calculator_label: the spreadsheet calculator, a repo path linked raw from main through
#   site.downloads_base (docs/_config.yml), so a download is always the latest committed version.
#   The label is the Download button's tooltip only: the page shows no version (owner, 2026-10-08).
#   EASI's and SFARI's test_site_links.py fail when a calculator is renamed without updating this file.
# - calculator_list: a generated list of calculators instead (DEEP: one per Level III ecoregion in
#   docs/_data/deep_calculators.json, written by apps/deep/scripts/build_site_calculators.py, which
#   DEEP's bake runs on every library publish).
- id: easi
  name: EASI
  full_name: Ecosystem Assessment Screening Index
  tier: Screening
  tier_num: 1
  role: Screening-tier assessment app
  description: Desktop screening with commonly used, nationally applicable metrics.
  url: https://gtmenichino-staf.share.connect.posit.cloud/?tool=easi
  calculator: apps/easi/www/calculator/EASI_Calculator_1.1.xlsx
  calculator_label: Excel, version 1.1
  status: live
  walkthrough: /walkthroughs/easi/
- id: sfari
  name: SFARI
  full_name: Stream Functions Assessment and Rapid Index
  tier: Rapid
  tier_num: 2
  role: Rapid-tier field assessment app
  description: Nationally applicable, function-based rapid field assessment with desktop evidence support.
  url: https://gtmenichino-staf.share.connect.posit.cloud/?tool=sfari
  calculator: apps/sfari/data/calculator/SFARI_Calculator_Draft_2026-06-29.xlsx
  calculator_label: Excel, draft
  status: live
- id: deep
  name: DEEP
  full_name: Detailed Evaluation of Ecosystem Processes
  tier: Detailed
  tier_num: 3
  role: Detailed-tier assessment app (predefined assessments included)
  description: Detailed, curve-based site assessment, with a regional assessment for each EPA Level III ecoregion.
  url: https://gtmenichino-staf.share.connect.posit.cloud/?tool=deep
  calculator_list: deep_calculators
  status: live
  walkthrough: /walkthroughs/deep/
  walkthrough_label: Read the guide
- id: curves
  name: stream-curves
  full_name: Reference and Regional Curve Builder
  tier: Detailed
  tier_num: 3
  role: Builds new detailed assessments for DEEP
  description: Builds the reference-curve assessments that DEEP runs. For assessment developers rather than day-to-day users. A Windows desktop app (StreamCurves Desktop).
  url: https://github.com/USACE-WRISES/staf/releases/latest
  status: live
  advanced: true # builder app: not shown as a launch card or linked on the site; the /stream-curves redirect lands on the StreamCurves Desktop download (the latest release)
