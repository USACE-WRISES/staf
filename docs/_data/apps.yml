# Canonical list of the STAF assessment web apps (hosted on Posit Connect Cloud).
# Consumed at build time by the Tools hub and the homepage/comparison links.
# This is the single source of truth for the site. When an app is re-homed
# (for example, a USACE-WRISES org account or a custom domain), update its url here.
# Each app also keeps its own copy of these URLs for its in-app STAF nav bar
# (there is no shared build step between this site and the Connect apps), so a
# URL change must also be mirrored in each app until a shared package exists.
- id: easi
  name: EASI
  full_name: Ecosystem Assessment Screening Index
  tier: Screening
  tier_num: 1
  role: Screening-tier assessment app
  description: Automated desktop screening using commonly used, nationally applicable metrics.
  url: https://gtmenichino-easi.share.connect.posit.cloud/
  status: live
- id: sfari
  name: SFARI
  full_name: Stream Functions Assessment and Rapid Index
  tier: Rapid
  tier_num: 2
  role: Rapid-tier field assessment app
  description: Nationally applicable, function-based rapid field assessment with desktop evidence support.
  url: https://gtmenichino-sfari.share.connect.posit.cloud/
  status: live
- id: deep
  name: DEEP
  full_name: Detailed Evaluation of Ecosystem Processes
  tier: Detailed
  tier_num: 3
  role: Detailed-tier assessment app (predefined assessments included)
  description: Runs detailed, curve-based site assessments. Comes with a limited number of predefined assessments out of the box.
  url: https://gtmenichino-deep.share.connect.posit.cloud/
  status: live
- id: curves
  name: stream-curves
  full_name: Reference and Regional Curve Builder
  tier: Detailed
  tier_num: 3
  role: Builds new detailed assessments for DEEP
  description: Builds new detailed assessments (reference curves) for use in DEEP. Developing an assessment is time-intensive.
  url: https://gtmenichino-stream-curves.share.connect.posit.cloud/
  status: live
