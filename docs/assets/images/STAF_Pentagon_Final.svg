<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 648" width="816" height="648">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowSm" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
    <!-- Clip paths for two-tone card headers -->
    <clipPath id="clipHydro"><rect x="323" y="200" width="170" height="88" rx="12"/></clipPath>
    <clipPath id="clipHydra"><rect x="537" y="356" width="170" height="88" rx="12"/></clipPath>
    <clipPath id="clipGeo"><rect x="455" y="607" width="170" height="88" rx="12"/></clipPath>
    <clipPath id="clipPhys"><rect x="191" y="607" width="170" height="88" rx="12"/></clipPath>
    <clipPath id="clipBio"><rect x="109" y="356" width="170" height="88" rx="12"/></clipPath>
    <!-- Gradient arcs for ECI ring -->
    <linearGradient id="grad1" gradientUnits="userSpaceOnUse" x1="408" y1="348" x2="524" y2="432.3">
      <stop offset="0%" stop-color="#8A9EC8"/>
      <stop offset="100%" stop-color="#6B82B8"/>
    </linearGradient>
    <linearGradient id="grad2" gradientUnits="userSpaceOnUse" x1="524" y1="432.3" x2="479.7" y2="568.7">
      <stop offset="0%" stop-color="#6B82B8"/>
      <stop offset="100%" stop-color="#C49A78"/>
    </linearGradient>
    <linearGradient id="grad3" gradientUnits="userSpaceOnUse" x1="479.7" y1="568.7" x2="336.3" y2="568.7">
      <stop offset="0%" stop-color="#C49A78"/>
      <stop offset="100%" stop-color="#B8A86A"/>
    </linearGradient>
    <linearGradient id="grad4" gradientUnits="userSpaceOnUse" x1="336.3" y1="568.7" x2="292" y2="432.3">
      <stop offset="0%" stop-color="#B8A86A"/>
      <stop offset="100%" stop-color="#82B572"/>
    </linearGradient>
    <linearGradient id="grad5" gradientUnits="userSpaceOnUse" x1="292" y1="432.3" x2="408" y2="348">
      <stop offset="0%" stop-color="#82B572"/>
      <stop offset="100%" stop-color="#8A9EC8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="816" height="785" fill="#FFFFFF"/>

  <!-- Subtitle -->
  <text x="408" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">5 Function Categories  ·  3 Outcome Sub-indices  ·  Ecosystem Condition Index</text>

  <g transform="translate(0,-158)">
  <!-- Pentagon filled background -->
  <polygon points="408,245 622,401 540,652 276,652 194,401"
           fill="#F3F2F1" stroke="none"/>

  <!-- ============ ECOSYSTEM CONDITION INDEX ============ -->

  <!-- Multi-color gradient ring -->
  <path d="M 408 348 A 122 122 0 0 1 524 432.3" fill="none" stroke="url(#grad1)" stroke-width="5"/>
  <path d="M 524 432.3 A 122 122 0 0 1 479.7 568.7" fill="none" stroke="url(#grad2)" stroke-width="5"/>
  <path d="M 479.7 568.7 A 122 122 0 0 1 336.3 568.7" fill="none" stroke="url(#grad3)" stroke-width="5"/>
  <path d="M 336.3 568.7 A 122 122 0 0 1 292 432.3" fill="none" stroke="url(#grad4)" stroke-width="5"/>
  <path d="M 292 432.3 A 122 122 0 0 1 408 348" fill="none" stroke="url(#grad5)" stroke-width="5"/>

  <!-- Pie slices -->
  <path d="M 408 470 L 408 350 A 120 120 0 0 1 511.9 530 Z" fill="#4472C4"/>
  <path d="M 408 470 L 511.9 530 A 120 120 0 0 1 304.1 530 Z" fill="#ED7D31"/>
  <path d="M 408 470 L 304.1 530 A 120 120 0 0 1 408 350 Z" fill="#70AD47"/>

  <!-- Slice divider lines -->
  <line x1="408" y1="470" x2="408" y2="350" stroke="white" stroke-width="2.5"/>
  <line x1="408" y1="470" x2="511.9" y2="530" stroke="white" stroke-width="2.5"/>
  <line x1="408" y1="470" x2="304.1" y2="530" stroke="white" stroke-width="2.5"/>

  <!-- Slice labels -->
  <text x="473" y="421" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Physical</text>
  <text x="473" y="436" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Outcomes</text>
  <text x="473" y="451" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Sub-index</text>
  <text x="408" y="531" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Chemical</text>
  <text x="408" y="546" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Outcomes</text>
  <text x="408" y="561" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Sub-index</text>
  <text x="343" y="421" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Biological</text>
  <text x="343" y="436" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Outcomes</text>
  <text x="343" y="451" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Sub-index</text>

  <!-- ECI label at center -->
  <circle cx="408" cy="470" r="38" fill="white"/>
  <text x="408" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#1B4D5C" text-anchor="middle">Ecosystem</text>
  <text x="408" y="475" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#1B4D5C" text-anchor="middle">Condition</text>
  <text x="408" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#1B4D5C" text-anchor="middle">Index</text>

  <!-- ============ DISCIPLINE CARDS (two-tone: colored header + white body) ============ -->

  <!-- Hydrology (top) -->
  <rect x="323" y="200" width="170" height="88" rx="12" fill="white" filter="url(#shadowSm)"/>
  <path d="M 335 200 H 481 Q 493 200 493 212 V 228 H 323 V 212 Q 323 200 335 200 Z" fill="#DAE2F4"/>
  <rect x="323" y="200" width="170" height="88" rx="12" fill="none" stroke="#A0B0D0" stroke-width="1.2" opacity="0.5"/>
  <text x="408" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2D3748" text-anchor="middle">Hydrology</text>
  <text x="408" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Catchment hydrology</text>
  <text x="408" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Surface water storage</text>
  <text x="408" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Reach inflow</text>
  <text x="408" y="276" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Streamflow regime</text>

  <!-- Hydraulics (upper-right) -->
  <rect x="537" y="356" width="170" height="88" rx="12" fill="white" filter="url(#shadowSm)"/>
  <path d="M 549 356 H 695 Q 707 356 707 368 V 384 H 537 V 368 Q 537 356 549 356 Z" fill="#A9BBD9"/>
  <rect x="537" y="356" width="170" height="88" rx="12" fill="none" stroke="#8A9DC0" stroke-width="1.2" opacity="0.5"/>
  <text x="622" y="376" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2D3748" text-anchor="middle">Hydraulics</text>
  <text x="622" y="396" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Low flow and baseflow dynamics</text>
  <text x="622" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">High flow dynamics</text>
  <text x="622" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Floodplain connectivity</text>
  <text x="622" y="432" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Hyporheic connectivity</text>

  <!-- Geomorphology (lower-right) -->
  <rect x="455" y="607" width="170" height="88" rx="12" fill="white" filter="url(#shadowSm)"/>
  <path d="M 467 607 H 613 Q 625 607 625 619 V 635 H 455 V 619 Q 455 607 467 607 Z" fill="#F5E1D0"/>
  <rect x="455" y="607" width="170" height="88" rx="12" fill="none" stroke="#D0B090" stroke-width="1.2" opacity="0.5"/>
  <text x="540" y="627" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2D3748" text-anchor="middle">Geomorphology</text>
  <text x="540" y="647" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Channel evolution</text>
  <text x="540" y="659" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Channel and floodplain dynamics</text>
  <text x="540" y="671" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Sediment continuity</text>
  <text x="540" y="683" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Bed composition and large wood</text>

  <!-- Physicochemistry (lower-left) -->
  <rect x="191" y="607" width="170" height="88" rx="12" fill="white" filter="url(#shadowSm)"/>
  <path d="M 203 607 H 349 Q 361 607 361 619 V 635 H 191 V 619 Q 191 607 203 607 Z" fill="#F2E9C2"/>
  <rect x="191" y="607" width="170" height="88" rx="12" fill="none" stroke="#C8BC88" stroke-width="1.2" opacity="0.5"/>
  <text x="276" y="627" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2D3748" text-anchor="middle">Physicochemistry</text>
  <text x="276" y="647" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Light and thermal regime</text>
  <text x="276" y="659" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Carbon processing</text>
  <text x="276" y="671" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Nutrient cycling</text>
  <text x="276" y="683" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Water and soil quality</text>

  <!-- Biology (upper-left) -->
  <rect x="109" y="356" width="170" height="88" rx="12" fill="white" filter="url(#shadowSm)"/>
  <path d="M 121 356 H 267 Q 279 356 279 368 V 384 H 109 V 368 Q 109 356 121 356 Z" fill="#DCEAD1"/>
  <rect x="109" y="356" width="170" height="88" rx="12" fill="none" stroke="#A0C090" stroke-width="1.2" opacity="0.5"/>
  <text x="194" y="376" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2D3748" text-anchor="middle">Biology</text>
  <text x="194" y="396" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Habitat provision</text>
  <text x="194" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Population support</text>
  <text x="194" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Community dynamics</text>
  <text x="194" y="432" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4B5563" text-anchor="middle">Watershed connectivity</text>

  </g>

  <!-- ============ DEFINITIONS CARD ============ -->
  <rect x="168" y="557" width="480" height="80" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="182" y="577" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#2D3748">Stream Functions:</text>
  <text x="284" y="577" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#2D3748">Represent capacity and performance through structure and processes.</text>
  <text x="182" y="595" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#2D3748">Outcomes:</text>
  <text x="241" y="595" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#2D3748">Observable or realized results from one or more functions operating together.</text>
  <text x="182" y="613" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#2D3748">Ecosystem Condition:</text>
  <text x="302" y="613" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#2D3748">The overall state of a stream system as reflected by Physical, Chemical,</text>
  <text x="182" y="627" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#2D3748">and Biological Outcomes. Interpreted relative to expected or reference conditions.</text>

</svg>